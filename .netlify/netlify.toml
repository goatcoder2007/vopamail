plugins = []
headers = []
redirects = []

[[headers]]
for = "/sw.js"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Service-Worker-Allowed = "/"

[[headers]]
for = "/manifest.webmanifest"

  [headers.values]
  Content-Type = "application/manifest+json"

[functions]

[functions."*"]

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[build]
command = "npm run build"
publish = "dist"
publishOrigin = "default"

