<section id="composePanel" class="compose-panel" hidden aria-label="Compose message">
  <header class="compose-head">
    <h2 id="composeTitle">New message</h2>
    <div class="compose-head-actions">
      <button id="minimizeCompose" class="icon-btn" type="button" aria-label="Minimize compose">
        <svg class="icon" aria-hidden="true"><use href="#i-minus"></use></svg>
      </button>
      <button id="closeCompose" class="icon-btn" type="button" aria-label="Close compose">
        <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
      </button>
    </div>
  </header>
  <form id="composeForm" class="compose-form">
    <div class="compose-field compose-field-recipient">
      <label for="composeTo">To</label>
      <input id="composeTo" type="text" placeholder="Classmate name" autocomplete="off">
      <div id="recipientSuggestions" class="recipient-suggestions"></div>
    </div>
    <div class="compose-field">
      <label for="composeSubject">Subject</label>
      <input id="composeSubject" type="text" placeholder="What is this about?">
    </div>
    <label class="sr-only" for="composeBody">Message</label>
    <textarea id="composeBody" placeholder="Write your message…"></textarea>
    <div id="composeModeration" class="compose-moderation" role="status" aria-live="polite" hidden></div>
    <div id="attachmentChips" class="attachment-chips"></div>
    <p id="composeError" class="form-error" role="alert" hidden></p>
    <footer class="compose-actions">
      <input id="fileInput" type="file" multiple hidden>
      <button id="attachBtn" class="btn ghost" type="button">Attach files</button>
      <button id="sendBtn" class="btn primary" type="submit">
        <span>Send</span>
        <svg class="icon" aria-hidden="true"><use href="#i-send"></use></svg>
      </button>
      <button id="saveDraftBtn" class="btn ghost" type="button">Save draft</button>
      <button id="discardBtn" class="icon-btn danger" type="button" title="Discard" aria-label="Discard message">
        <svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg>
      </button>
    </footer>
  </form>
</section>
