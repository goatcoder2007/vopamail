<aside id="sidebar" class="sidebar">
  <div class="sidebar-head">
    <div class="brand">
      <span class="brand-mark small school-mark">
        <img src="valley-of-peace-logo.png" width="428" height="467" alt="Valley of Peace SDA Academy logo">
      </span>
      <span>Vopa Mail</span>
    </div>
    <button id="closeSidebar" class="icon-btn close-sidebar" type="button" aria-label="Close menu">
      <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
    </button>
  </div>

  <button id="composeBtn" class="compose-btn" type="button">
    <svg class="icon" aria-hidden="true"><use href="#i-pencil"></use></svg>
    <span>Compose</span>
  </button>

  <div id="sectionSwitcher" class="section-switcher" hidden>
    <div class="section-switcher-head">
      <label for="sectionInput">Class section</label>
      <span class="section-dot" aria-hidden="true"></span>
    </div>
    <div class="section-switcher-row">
      <div class="section-input-wrap">
        <svg class="icon" aria-hidden="true"><use href="#i-layers"></use></svg>
        <input id="sectionInput" type="text" maxlength="24" autocomplete="off" spellcheck="false" list="sectionOptions" placeholder="Section code">
        <datalist id="sectionOptions"></datalist>
      </div>
      <button id="switchSectionBtn" class="section-switch-btn" type="button" aria-label="Switch section" title="Switch section">
        <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
        <span>Switch</span>
      </button>
    </div>
    <div id="sectionChips" class="section-chips" aria-label="Saved sections"></div>
  </div>

  <nav id="folders" class="folders" aria-label="Mail folders">
    <button type="button" data-folder="inbox" class="folder active" aria-current="page">
      <svg class="icon" aria-hidden="true"><use href="#i-inbox"></use></svg><span>Inbox</span><em id="unreadBadge" class="badge" hidden>0</em>
    </button>
    <button type="button" data-folder="starred" class="folder">
      <svg class="icon" aria-hidden="true"><use href="#i-star"></use></svg><span>Starred</span>
    </button>
    <button type="button" data-folder="sent" class="folder">
      <svg class="icon" aria-hidden="true"><use href="#i-send"></use></svg><span>Sent</span>
    </button>
    <button type="button" data-folder="drafts" class="folder">
      <svg class="icon" aria-hidden="true"><use href="#i-file"></use></svg><span>Drafts</span><em id="draftBadge" class="badge" hidden>0</em>
    </button>
    <button type="button" data-folder="trash" class="folder">
      <svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg><span>Trash</span>
    </button>
    <button type="button" data-folder="classmates" class="folder">
      <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg><span id="classmateLabel">Classmates</span><em id="classmateBadge" class="badge" hidden>0</em>
    </button>
    <button type="button" data-folder="dashboard" class="folder teacher-only admin-folder" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-grid"></use></svg><span>All sections</span>
    </button>
    <button type="button" data-folder="roster" class="folder teacher-only" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg><span>Class roster</span>
    </button>
    <button type="button" data-folder="all" class="folder teacher-only" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-layers"></use></svg><span>All class mail</span>
    </button>
    <button type="button" data-folder="flags" class="folder teacher-only" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-alert"></use></svg><span>Flagged</span><em id="flagBadge" class="badge" hidden>0</em>
    </button>
  </nav>

  <div id="teacherBlock" class="contacts-block">
    <h2><svg class="icon" aria-hidden="true"><use href="#i-star"></use></svg> ME</h2>
    <div id="teacherList" class="contacts-list"></div>
  </div>

  <div id="classSettings" class="class-settings" hidden>
    <div class="class-settings-head">
      <svg class="icon" aria-hidden="true"><use href="#i-layers"></use></svg>
      <span>Class settings</span>
    </div>
    <label class="setting-row" for="studentMessagingToggle">
      <span class="setting-copy">
        <strong>Student-to-student mail</strong>
        <small>Let students email classmates</small>
      </span>
      <input id="studentMessagingToggle" class="switch-input" type="checkbox" checked>
      <span class="switch" aria-hidden="true"></span>
    </label>
  </div>

  <div class="sidebar-foot">
    <span id="userAvatar" class="avatar"></span>
    <span class="user-copy"><strong id="userName"></strong><small id="userEmail"></small><small id="userMeta"></small></span>
    <button id="signOutBtn" class="icon-btn" type="button" title="Sign out" aria-label="Sign out">
      <svg class="icon" aria-hidden="true"><use href="#i-logout"></use></svg>
    </button>
  </div>
</aside>

<div id="sidebarScrim" class="sidebar-scrim" hidden></div>
